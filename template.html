<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{title}}</title>
  <link rel="alternate" type="application/rss+xml" title="Regular Labs" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div class="layout">
    <input type="checkbox" id="nav-toggle" class="nav-toggle">
    <label for="nav-toggle" class="nav-toggle-label" aria-label="Toggle navigation menu"><span></span><span></span><span></span></label>
    <label for="nav-toggle" class="nav-overlay" aria-hidden="true"></label>
    <nav>
      <div class="breadcrumb">{{breadcrumb}}</div>
      {{toc}}
      <div class="nav-footer">
        <a href="/changelog">Changelog</a> ·
        <a href="/feed.xml">RSS</a>
      </div>
    </nav>
    <main>
      {{content}}
    </main>
  </div>
</body>
</html>
